name: Build CBE 1.8.8 recovery

on:
  push:
    branches: [ recovery-1.8.8-audio ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4

      - name: Apply recovered 1.8.8 changes
        run: |
          set -euo pipefail
          # The base rebuild script intentionally contained a guard which caught
          # additional cold-cache call sites on the first CI run. Disable only
          # that intermediate guard; finalize_188.py rewrites and re-validates
          # every production call site before packaging.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.recovery/rebuild_188.py')
          s=p.read_text()
          old="if 'AudioProbe.run(' in s:\n    raise SystemExit('production BuildPipeline still calls AudioProbe.run reference renderer')\np.write_text(s, encoding=\"utf-8\")"
          new="p.write_text(s, encoding=\"utf-8\")"
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          python3 .recovery/rebuild_188.py
          python3 .recovery/finalize_188.py

      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 zip

      - name: Validate package source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'manifest.json').read_text())
          main=(root/'main.lua').read_text()
          assert manifest['version']=='1.8.8-recovery.1', manifest['version']
          assert 'local VERSION="1.8.8-recovery.1"' in main
          bp=(root/'extract/BuildPipeline.lua').read_text()
          ap=(root/'extract/AudioProbe.lua').read_text()
          pm=(root/'extract/PortableMusyX.lua').read_text()
          cm=(root/'lib/CacheManager.lua').read_text()
          assert 'AudioProbe.runCanonicalFull' in bp
          assert 'AudioProbe.run(' not in bp
          assert 'AudioProbe.runPortableFull' not in bp
          assert 'audioPlatformSupported' not in bp
          assert 'cbe-audio-canonical=8' in bp and 'cbe-audio-canonical=8' in ap and 'cbe-audio-canonical=8' in cm
          assert 'runReferenceAmuse=A.run' in ap
          assert 'decodeSignedPacked' in pm
          assert 'if a>=64 then return a+128' in pm
          assert 'v.startSec/outputRate' not in pm
          assert '.cbe-audio-exhausted-v1.complete' in bp and '.cbe-audio-exhausted-v1.complete' in cm
          assert 'function A.realDt(ctx,dt) return math.max(0,tonumber(dt) or 0)/battleSpeed(ctx) end' in (root/'lib/TrainerPerformance.lua').read_text()
          forbidden={'.iso','.gcm','.ciso','.7z'}
          bad=[str(p) for p in root.rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not bad, bad
          print('SOURCE_CONTRACT_OK')
          PY
          count=0
          while IFS= read -r -d '' f; do
            luac5.4 -p "$f"
            count=$((count+1))
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          echo "LUA_PARSE_OK $count"

      - name: Build launcher-ready ZIP
        run: |
          set -euo pipefail
          OUT="ColosseumBattleEnvironments-1.8.8-recovery.1.zip"
          rm -f "$OUT" "$OUT.sha256"
          zip -q -r "$OUT" . \
            -x '.git/*' '.github/*' '.recovery/*' '.materialize/*' \
               '*.zip' '*.sha256'
          unzip -t "$OUT"
          python3 - <<'PY'
          import json, zipfile
          z=zipfile.ZipFile('ColosseumBattleEnvironments-1.8.8-recovery.1.zip')
          names=set(z.namelist())
          assert 'main.lua' in names
          assert 'manifest.json' in names
          assert 'mod.card' in names
          m=json.loads(z.read('manifest.json'))
          assert m['version']=='1.8.8-recovery.1'
          print('ZIP_ROOT_OK', len(names))
          PY
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CBE-1.8.8-recovery.1
          path: |
            ColosseumBattleEnvironments-1.8.8-recovery.1.zip
            ColosseumBattleEnvironments-1.8.8-recovery.1.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="1.8.8-recovery.1"
          OUT="ColosseumBattleEnvironments-1.8.8-recovery.1.zip"
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" "$OUT" "$OUT.sha256" \
            --target "$GITHUB_SHA" \
            --title "CBE 1.8.8 recovery.1" \
            --notes-file RECOVERY_1.8.8.md
