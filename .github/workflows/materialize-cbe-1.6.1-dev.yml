name: Materialize CBE 1.6.1 dev branch

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/materialize-cbe-1.6.1-dev.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'Materialize Colosseum Battle Environments 1.6.1 on dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Download and validate exact CBE 1.6.1 release asset
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://github.com/HighDrexler/Colosseum-Battle-Environments-1.0-BETA/releases/download/1.6.1/ColosseumBattleEnvironments-1.6.1.zip' \
            -o /tmp/ColosseumBattleEnvironments-1.6.1.zip
          echo '602cd59caeff1659c9129a8d87d95c6e70d5ec03ec16b7ca8ca54fed907e8a31  /tmp/ColosseumBattleEnvironments-1.6.1.zip' | sha256sum -c -
          rm -rf /tmp/cbe-release
          mkdir -p /tmp/cbe-release
          unzip -q /tmp/ColosseumBattleEnvironments-1.6.1.zip -d /tmp/cbe-release

          test -f /tmp/cbe-release/main.lua
          test -f /tmp/cbe-release/manifest.json
          test -f /tmp/cbe-release/mod.card
          grep -q '"version": "1.6.1"' /tmp/cbe-release/manifest.json
          test -f /tmp/cbe-release/lib/PokemonActors.lua
          test -f /tmp/cbe-release/lib/MoveFXOwnership.lua
          test -f /tmp/cbe-release/lib/NativeLauncherCompat.lua
          test -f /tmp/cbe-release/extract/PokemonExtractor.lua
          test -f /tmp/cbe-release/assets/audio/colosseum_battle_entry_sting.wav
          test -f /tmp/cbe-release/assets/cbe/wildlands/ground_meadow_128.rgba
          test -f /tmp/cbe-release/third_party/amuse/amuserender.exe
          echo '65840d001001ec83b9b62fb6d545aa216b08e7ed385c0857b98bbeb7de1dc884  /tmp/cbe-release/third_party/amuse/amuserender.exe' | sha256sum -c -
          test "$(find /tmp/cbe-release -type f | wc -l)" -eq 70

      - name: Replace dev branch root with launcher-ready 1.6.1 tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/cbe-release/. .
          rm -f .github/workflows/materialize-cbe-1.6.1-dev.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          test -f main.lua
          test -f manifest.json
          test -f mod.card
          grep -q '"version": "1.6.1"' manifest.json
          test -f lib/PokemonActors.lua
          test -f lib/MoveFXOwnership.lua
          test -f lib/NativeLauncherCompat.lua
          test -f extract/PokemonExtractor.lua
          test -f third_party/amuse/amuserender.exe
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 70
          test ! -e ColosseumBattleEnvironments-1.6.1.zip

      - name: Commit exact 1.6.1 repository tree to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HighDrexler'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Colosseum Battle Environments 1.6.1 on dev'
          git push origin HEAD:dev
