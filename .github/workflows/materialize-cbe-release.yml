name: Materialize CBE 1.0.0 release

on:
  push:
    paths:
      - '.release_payload/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'Materialize Colosseum Battle Environments 1.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct validated release ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .release_payload/part-* > /tmp/cbe-release.b64
          base64 --decode /tmp/cbe-release.b64 > /tmp/Colosseum-Battle-Environments-1.0.0.zip
          echo 'd02c409a9ac06d7398e08b090e9fd0e59a65aa8bacee443505c19f9c10fa2b5f  /tmp/Colosseum-Battle-Environments-1.0.0.zip' | sha256sum -c -
          rm -rf /tmp/cbe-release
          mkdir -p /tmp/cbe-release
          unzip -q /tmp/Colosseum-Battle-Environments-1.0.0.zip -d /tmp/cbe-release
      - name: Replace repository root with launcher-ready release tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .release_payload ! -name .github -exec rm -rf {} +
          cp -a /tmp/cbe-release/. .
          rm -rf .release_payload
          rm -f .github/workflows/materialize-cbe-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          test -f main.lua
          test -f manifest.json
          test -f mod.card
          test -f third_party/amuse/amuserender.exe
          test -f assets/cbe/wildlands/ground_meadow_128.rgba
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 48
      - name: Commit exact 1.0.0 repository tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HighDrexler'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Colosseum Battle Environments 1.0.0'
          git push origin HEAD:main
