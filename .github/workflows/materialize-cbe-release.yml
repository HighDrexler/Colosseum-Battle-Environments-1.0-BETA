name: Materialize CBE 1.2 repository source

on:
  push:
    paths:
      - '.release_payload/READY'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'Materialize Colosseum Battle Environments 1.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact 1.2 package
        shell: bash
        run: |
          set -euo pipefail
          cp .release_payload/Colosseum-Battle-Environments-1.2.zip /tmp/Colosseum-Battle-Environments-1.2.zip
          echo 'd81416d45e91d1bc77c3d660be87f80064d12963bf0495e627087e547a7641d6  /tmp/Colosseum-Battle-Environments-1.2.zip' | sha256sum -c -
          rm -rf /tmp/cbe-release
          mkdir -p /tmp/cbe-release
          unzip -q /tmp/Colosseum-Battle-Environments-1.2.zip -d /tmp/cbe-release
          test -f /tmp/cbe-release/main.lua
          test -f /tmp/cbe-release/manifest.json
          test -f /tmp/cbe-release/mod.card
          grep -q '"version": "1.2"' /tmp/cbe-release/manifest.json
          test -f /tmp/cbe-release/assets/audio/colosseum_battle_entry_sting.wav
          test -f /tmp/cbe-release/assets/cbe/wildlands/ground_meadow_128.rgba
          test ! -e /tmp/cbe-release/third_party/amuse/amuserender.exe
          test "$(find /tmp/cbe-release -type f | wc -l)" -eq 50
      - name: Replace repository root with launcher-ready 1.2 tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .release_payload ! -name .github -exec rm -rf {} +
          cp -a /tmp/cbe-release/. .
          rm -rf .release_payload
          rm -f .github/workflows/materialize-cbe-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          test -f main.lua
          test -f manifest.json
          test -f mod.card
          grep -q '"version": "1.2"' manifest.json
          test -f assets/audio/colosseum_battle_entry_sting.wav
          test -f assets/cbe/wildlands/ground_meadow_128.rgba
          test ! -e third_party/amuse/amuserender.exe
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 50
      - name: Commit exact 1.2 repository tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HighDrexler'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize Colosseum Battle Environments 1.2'
          git push origin HEAD:main
